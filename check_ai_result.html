<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Главная</a> | 
        <a href="/about">О нас</a> | 
        <a href="/check-ai">Проверка на ИИ</a>
    </nav>
    
    <h1>{{ title }}</h1>
    
    <p><b>Вероятность ИИ:</b> {{ ai_prob }}%</p>
    <p><b>Вероятность человека:</b> {{ human_prob }}%</p>
    <p><b>Вердикт:</b> {{ verdict }}</p>
    
    <hr>
    <h3>Текст работы:</h3>
    <p>{{ original_text }}</p>
    
    <hr>
    <h3>Детали проверки:</h3>
    <div>
        {{ result | safe }}
    </div>
    
    

    <a href="/check-ai">← Еще раз</a>
</body>
</html>
